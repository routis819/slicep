name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install re2c and goaugtype
        run: |
          sudo apt-get update
          sudo apt-get install -y re2c
          git clone --depth 1 https://github.com/routis819/goaugtype.git /tmp/goaugtype
          GOTOOLCHAIN=auto go install -C /tmp/goaugtype ./cmd/goaugtype

      - name: Verify go generate is up to date
        run: |
          go generate ./...
          git diff --exit-code

      - name: Run goaugtype
        run: goaugtype ./...

      - name: Run tests
        run: go test -v ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1
